name: DangMob
version: 1.1.0
main: my.dangmob.DangMob
api-version: "1.20"
commands:
  mob:
    description: Remove mobs around you
    usage: /dmob [hostile]
    aliases: [dmob, clearmobs]
permissions:
  dangmob.use:
    description: Remove mobs around yourself
    default: true
  dangmob.admin:
    description: Remove all mobs server-wide and reload the config
    default: op
  dangmob.bypass:
    description: Skip the command cooldown
    default: op
